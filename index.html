      </div>

      <div class="completed">

        <div style="left: 200px;" id="arrow-completed" class="arrow-down" onclick="toggleTasksCompleted(this.classList)">
        </div>
        <section class="task-list-completed">
            <ul id="completed-tasks" aria-live="polite"></ul>
        </section>
      </div>

      function getAuthToken() {
        return sessionStorage.getItem('accessToken');
      }

      function checkAuth() {
        const token = getAuthToken();
        if (!token) {
          alert('Please log in first');
          window.location.href = 'login.html';
          return false;
        }
        return true;
      }

      function displayAccountDetails() {
        const accountModal = document.getElementById("accountView");
        const span = document.getElementsByClassName("close")[0];
        const menu = document.getElementById("checkboxMenu");
        menu.checked = false;
        // Fetch and display account details here
        // For now, just a placeholder
        // modal.querySelector("p").innerText = sessionStorage.username + "Account details functionality - coming soon!";
        accountModal.style.display = "block";
        const isGoogleUser = sessionStorage.getItem('googleUser') === 'true';
        if(isGoogleUser){
          try{
            const idToken = sessionStorage.getItem('idToken');
            const payload = JSON.parse(atob(idToken.split('.')[1]));
            
            document.getElementById("email").innerText = "Email: " + (payload.email || 'N/A');
            document.getElementById("username").innerText = "Username: " + (payload.email || 'Google User');
            
            // Hide password field for Google users
            document.getElementById("password").parentElement.style.display = "none";
            
            // Add a note that it's a Google account
            const note = document.createElement('p');
            note.innerText = "Signed in with Google";
            note.style.fontStyle = "italic";
            note.style.color = "#666";
            document.querySelector('.account-content').appendChild(note);
          }catch(e){
            console.error('Error parsing Google token:', e);
          }
        }else{
          console.log(sessionStorage.getItem('email'));
          document.getElementById("email").innerText = "Email: " + sessionStorage.getItem('email');
          document.getElementById("username").innerText = "Username: " + sessionStorage.getItem('username');
          document.getElementById("password").value = sessionStorage.getItem('password');
        }

        span.onclick = function() {
          accountModal.style.display = "none";
        }

        window.onclick = function(event) {
          if (event.target == accountModal) {
            accountModal.style.display = "none";
          }
        }
      }

      function showPassword(){
        var passwordInput = document.getElementById("password");
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
        } else {
          passwordInput.type = "password";
        }
      }

      async function apiCall(endpoint, method = 'GET', body = null) {
        const token = getAuthToken();
        const options = {
          method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': token
          }
        };
        
        if (body) {
          options.body = JSON.stringify(body);
        }
        
        const response = await fetch(`${API_URL}${endpoint}`, options);
        
        if (response.status === 401 || response.status === 403) {
          alert('Session expired. Please log in again.');
          window.location.href = 'login.html';
          return null;
        }
        
        return await response.json();
      }

      async function loadTasks() {
        try {
          const data = await apiCall('/tasks');
          if (!data) return [];
          
          // Filter active tasks (not done)
          return data.tasks.filter(task => !task.done);
        } catch (e) {
          console.error('Error loading tasks:', e);
          return [];
        }
      }

      async function loadCompletedTasks() {
        try {
          const data = await apiCall('/tasks');
          if (!data) return [];
          
          // Filter completed tasks
          return data.tasks.filter(task => task.done);
        } catch (e) {
          console.error('Error loading completed tasks:', e);
          return [];
        }
      }

      function toggleTasks(classList){
        var arrow = document.getElementById("arrow");
        classList.toggle("active");
        var x = document.getElementById("tasks");
        if (x.style.display === "none") {
          x.style.display = "block";
        } else {
          x.style.display = "none";
        }
      }

        var arrow = document.getElementById("arrow-completed");

        if (x.style.display === "none") {

        } else {

          //     render();
          // });

          // const span = document.createElement('span');

          // span.textContent = task.text;

          // const del = document.createElement('button');
          // del.className = 'btn-delete';

          const span = document.createElement('span');
          span.className = 'task-text';
          span.id = `task-text-${task.taskID}`;
          span.textContent = task.text;

          const edit = document.createElement('button');
          edit.className = 'btn-edit';

          const wrapperEdit = document.createElement('i');

          edit.appendChild(wrapperEdit);
          // edit.textContent = 'Edit';

            const taskTextElement = document.getElementById(`task-text-${task.taskID}`);
            taskTextElement.contentEditable = true;
            taskTextElement.focus();
            
            const saveEdit = async () => {
              taskTextElement.contentEditable = false;
              await apiCall(`/tasks/${task.taskID}`, 'PUT', {

            };

            taskTextElement.addEventListener('blur', saveEdit, {once: true});
            taskTextElement.addEventListener('keypress', (e) => {

                saveEdit();
              }
            });

          const del = document.createElement('button');
          del.className = 'btn-delete';
          del.setAttribute('aria-label', 'Delete task');
          
          const wrapper = document.createElement('i');

              text: task.text,
              done: task.done,
              dueDate: dueDate.value
            });

          });

          li.appendChild(chk);
          li.appendChild(span);
          li.appendChild(edit);
          li.appendChild(del);
          li.appendChild(dueDate);
          list.appendChild(li);
        });
      }

      async function renderCompletedTasks() {
        const tasks = await loadCompletedTasks();
        completedList.innerHTML = '';
        
        tasks.forEach(task => {
          const li = document.createElement('li');
          li.className = 'task-item done';

          const chk = document.createElement('input');
          chk.type = 'checkbox';
          chk.className = 'task-checkbox';
          chk.checked = true;
          chk.setAttribute('aria-label', 'Mark task as incomplete');
          chk.addEventListener('change', async () => {
            if (!chk.checked) {
              // Move back to active tasks
              await apiCall(`/tasks/${task.taskID}`, 'PUT', {
                text: task.text,
                done: false,
                dueDate: task.dueDate || ''
              });
              
              render();
              renderCompletedTasks();
            }
          });

          const span = document.createElement('span');
          span.className = 'task-text';
          span.textContent = task.text;

          const del = document.createElement('button');
          del.className = 'btn-delete';
          del.setAttribute('aria-label', 'Delete task');
          //del.textContent = 'Delete';
          const wrapper = document.createElement('i');
          wrapper.className = 'fa fa-trash';
          del.appendChild(wrapper);
          del.addEventListener('click', async () => {
            await apiCall(`/tasks/${task.taskID}`, 'DELETE');
            renderCompletedTasks();
          });

          const dueDate = document.createElement('input');
          dueDate.type = 'date';
          dueDate.className = 'due-date';
          dueDate.value = task.dueDate || '';
          dueDate.disabled = true;

          li.appendChild(chk);
          li.appendChild(span);
          li.appendChild(del);
          li.appendChild(dueDate);
          completedList.appendChild(li);
        });
      }

      async function addTask(text){
        const trimmed = String(text||'').trim();
        if(!trimmed) return;
        // const tasks = loadTasks();
        // tasks.push({text: trimmed, done: false});
        // saveTasks(tasks);
        // render();
        await apiCall('/tasks', 'POST', {
          text: trimmed,
          done: false,
          dueDate: ''
        });
        render();
      }

      addBtn.addEventListener('click', ()=>{ addTask(input.value); input.value=''; input.focus(); });

      input.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter'){
          addTask(input.value);
          input.value='';
        }
      });
