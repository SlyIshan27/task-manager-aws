<html>
    <head>
        <title>Sign Up</title>
        <link rel="stylesheet" href="login.css">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>   
    </head>

    <body>
        <h1>TaskMate Login</h1>

        <div class="alert" id="alert">
            <p>Error</p>
            <span class="close-alert" onclick="closeAlert()">&times;</span>
        </div>

        <form id="signup-form">
            <div class="container">

                <label for="email"><b>Email</b></label>
                <input id="email" name="email" type="text" placeholder="Enter Email">

                <label for="username"><b>Username</b></label>
                <input id="username" name="username" type="text" placeholder="Enter Username">

                <label for="password"><b>Password</b></label>
                <input id="password" name="password" type="password" placeholder="Enter Password">

                <div class="actions">
                    <button style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Calibri, 'Helvetica Neue', Arial;" type="submit" class="primary">Sign Up</button>
                    <button style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Calibri, 'Helvetica Neue', Arial;" type="button" class="secondary" onclick="signIn()">Sign In</button>
                </div>
            </div>
        </form>

        <form id="verify-form" style="display: none;">
            <div class="container">
                <p>A verification code has been sent to your email. Please enter it below:</p>
                
                <label for="verification-code"><b>Verification Code</b></label>
                <input id="verification-code" name="verification-code" type="text" placeholder="Enter 6-digit code">

                <div class="actions">
                    <button style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Calibri, 'Helvetica Neue', Arial;" type="submit" class="primary">Verify</button>
                    <button style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Calibri, 'Helvetica Neue', Arial;" type="button" class="secondary" onclick="resendCode()">Resend Code</button>
                </div>
            </div>
        </form>
    
        <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.6/dist/amazon-cognito-identity.min.js"></script>

        <script>
        
        function getSimpleErrorMessage(error) {
            const message = error.message || error.toString();
            if (message.includes("Member must have length greater than or equal to 1") || 
                message.includes("username") && message.includes("null")) {
                return "Please enter a username.";
            }
            else if (message.includes("password") && message.includes("Member must satisfy regular expression pattern")) {
                return "Please enter a password.";
            }
            else if (message.includes("email") && message.includes("null")) {
                return "Please enter an email address.";
            }
            else if (message.includes("Password did not conform with policy")) {
                return "Password must be at least 8 characters with uppercase, lowercase, special characters, and numbers.";
            }
            else if (message.includes("User already exists") || message.includes("UsernameExistsException")) {
                return "This username is already taken.";
            }
            else if (message.includes("Invalid email address format")) {
                return "Please enter a valid email address.";
            }
            else if (message.includes("validation errors detected")) {
                return "Please fill in all fields correctly.";
            }
            
            // Default fallback
            return "Error signing up. Please check your information and try again.";
        }

        function closeAlert() {
            const alertBox = document.getElementById("alert");
            alertBox.classList.remove("show");
        }
        function errorMessage(message) {
            const alertBox = document.getElementById("alert");
            alertBox.classList.remove("show");

            void alertBox.offsetWidth;
            alertBox.classList.add("show");
            alertBox.querySelector("p").innerText = message;

            setTimeout(() => {
                alertBox.classList.remove("show");
            }, 6000);
        }
        window.onload = function () {
            const poolData = {
                UserPoolId: "us-east-1_SE2OKlq4a",
                ClientId: "5jjasp2n08ejrsrte3o5ckd00t"
            };
            
            const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
            let currentUsername = '';

            

            // Handle Sign Up
            async function signUp(event){
                event.preventDefault();

                const email = document.getElementById("email").value;
                const username = document.getElementById("username").value;
                const password = document.getElementById("password").value;

                const attributeList = [];
                const dataEmail = {
                    Name: 'email',
                    Value: email
                };
                const attributeEmail = new AmazonCognitoIdentity.CognitoUserAttribute(dataEmail);
                attributeList.push(attributeEmail);

                userPool.signUp(username, password, attributeList, null, function(err, result) {
                    if (err) {
                        console.error("Error signing up:", err);
                        // alert(err.message || JSON.stringify(err));
                        errorMessage(getSimpleErrorMessage(err));
                        return;
                    }
                    const cognitoUser = result.user;
                    currentUsername = username;
                    console.log('User name is ' + cognitoUser.getUsername());
                    document.getElementById("signup-form").style.display = "none";
                    document.getElementById("verify-form").style.display = "block";
                    // alert("Sign-up successful! Please check your email for a verification code.");
                });
            }

            function verifyCode(){
                event.preventDefault();

                const code = document.getElementById("verification-code").value;

                const userData = {
                    Username: currentUsername,
                    Pool: userPool
                };

                const cognitoUser = new AmazonCognitoIdentity.CognitoUser(userData);
                cognitoUser.confirmRegistration(code, true, function(err, result) {
                    if (err) {
                        console.error("Error verifying code:", err);
                        // alert(err.message || JSON.stringify(err));
                        errorMessage("Not a valid verification code.");
                        return;
                    }
                    console.log('Verification result: ' + result);
                    alert("Account verified successfully! Redirecting to login...");
                    window.location.href = "login.html";
                });
            }

            window.resendCode = function() {
                const userData = {
                    Username: currentUsername,
                    Pool: userPool
                };

                const cognitoUser = new AmazonCognitoIdentity.CognitoUser(userData);

                cognitoUser.resendConfirmationCode(function(err, result) {
                    if (err) {
                        console.error("Error resending code:", err);
                        alert(err.message || JSON.stringify(err));
                        return;
                    }
                    errorMessage("Verification code resent! Check your email.");
                });
            };

            // Redirect to login
            window.signIn = function () {
                window.location.href = "login.html";
            };

            document.getElementById("signup-form").addEventListener("submit", signUp);
            document.getElementById("verify-form").addEventListener("submit", verifyCode);
        };
        </script>
    </body>
</html>
